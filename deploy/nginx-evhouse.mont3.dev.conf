# nginx site for the EV House website, on server 2 (24.199.86.139).
#
# Installed at /etc/nginx/sites-available/evhouse.mont3.dev and linked from sites-enabled. The copy
# in the repository (deploy/nginx-evhouse.mont3.dev.conf) must stay identical to the installed file,
# including the five lines certbot adds (marked "managed by Certbot"). On a box that has no
# certificate yet, install the first server block only, with `listen 80;` in place of those five
# lines, reload, then run
#   sudo certbot --nginx -d evhouse.mont3.dev --redirect
# and replace the port-80 block certbot writes with the one at the end of this file.
#
# `nginx -t` first, every time: a syntax error takes down every site on the box, not just this one.

server {
    server_name evhouse.mont3.dev;

    # This site's own logs, so that whoever deploys it can read them without reading the logs of
    # the other sites on the box (deploy/README.md, "Who can deploy").
    access_log /var/log/nginx/evhouse.access.log;
    error_log  /var/log/nginx/evhouse.error.log;

    # A preview on a Mont3 name, not EV House's production site: keep it out of search engines
    # whatever the app itself says. Drop these two when the site moves to the client's domain.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    # The admin uploads property photos; nginx's default limit of 1 MB would refuse them.
    client_max_body_size 25m;

    # The photos, straight from disk (DJANGO_MEDIA_ROOT): Django serves media only with DEBUG on
    # (config/urls.py). Static files are the app's own business (WhiteNoise), so they go through.
    location /media/ {
        alias /srv/evhouse/data/media/;
    }

    location / {
        proxy_pass         http://127.0.0.1:3300;
        proxy_http_version 1.1;

        # Host is a literal, not the request's Host variable: this site serves one name only, so
        # the upstream has no reason to trust the Host header a client sent (semgrep's
        # request-host-used rule). It is the one name in DJANGO_ALLOWED_HOSTS.
        proxy_set_header   Host              evhouse.mont3.dev;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # gunicorn runs with --timeout 120.
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/evhouse.mont3.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/evhouse.mont3.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Plain HTTP only redirects. certbot --redirect wrote this block around the request's Host variable;
# the name is a literal here instead, like the proxy's Host header above (semgrep's
# request-host-used). Renewals still work: for its HTTP-01 challenge certbot puts a
# `rewrite ... break` at the top of this block, ahead of the return.
server {
    listen 80;
    server_name evhouse.mont3.dev;
    return 301 https://evhouse.mont3.dev$request_uri;
}
